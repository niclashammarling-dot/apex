name: APEX Nightly Audit + Fixer

on:
  schedule:
    - cron: '0 1 * * *'   # 1am UTC daily
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0   # full history for git log checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Run mechanical checks
        run: python audit/mechanical_checks.py

      - name: Run LLM checks (GPT-4o)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python audit/llm_checks.py

      - name: Commit audit report
        run: |
          git config user.name "APEX Audit Bot"
          git config user.email "audit-bot@apex"
          git add audit/nightly-report-*.md audit/CHECKS.md
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "audit: nightly report $(date +%Y-%m-%d)"
          git push

      - name: Run Fixer Agent
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python audit/fixer.py
