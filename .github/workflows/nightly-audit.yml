name: APEX Nightly Audit + Fixer

on:
  schedule:
    - cron: '0 1 * * *'   # 1am UTC daily
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0   # full history for git log checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch host-published audit state
        # Orphan branch written nightly by the APEX host (audit/publish_state.py).
        # A missing or stale file is not an error here — CHECK 73 reports it.
        run: |
          mkdir -p audit/state
          if git fetch -q origin audit-state; then
            git show FETCH_HEAD:latest.json > audit/state/latest.json && echo "fetched audit-state"
          else
            echo "audit-state branch not found"
          fi

      - name: Run mechanical checks
        run: python -m audit.mechanical_checks --merge-state audit/state/latest.json

      - name: Run LLM checks (GPT-4o)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python audit/llm_checks.py

      - name: Verify LLM findings
        run: python audit/verify_llm_findings.py

      - name: Commit audit report
        run: |
          git config user.name "APEX Audit Bot"
          git config user.email "audit-bot@apex"
          git add audit/nightly-report-*.md audit/CHECKS.md
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "audit: nightly report $(date +%Y-%m-%d)"
          git push

      - name: Alert on CRITICAL findings
        env:
          ALERT_EMAIL_TO:   ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_SMTP_USER:  ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASS:  ${{ secrets.ALERT_SMTP_PASS }}
        run: python audit/alert_criticals.py

      - name: Run Fixer Agent
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python audit/fixer.py
