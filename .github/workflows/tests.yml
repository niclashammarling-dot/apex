name: APEX Tests

on:
  push:
    # ci-verify/** exists so a deliberate break can be pushed and OBSERVED
    # failing without opening a PR. A workflow nobody has watched fail is the
    # "exists therefore runs" premise the audit loop was falsified on three
    # times in one summer; one observed red run is the affirmative evidence.
    # Every branch (Niclas 2026-10-24: "i framtiden kör vi test på alla grenar"). port-regime
    # carried 77 commits CI never saw; its first CI run was the merge, red on two tests
    # (runs 187-190).
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tests/test_battery_2026_10.py checks that every FIXES commit is an
          # ancestor of HEAD and not of the archive commit. The default depth-1 checkout has
          # neither, and the test came with the port-regime merge (0964e7e); runs 187-189 red
          # (2026-10-24).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # conftest.py redirects the DB to a temp file; no .env or network needed.
        # A red run here is the floor — the suite was silently red for 11 weeks
        # (2026-06-26 → 2026-09-13) with no consumer before this job existed.
        env:
          PYTHONPATH: .
          # The function ratchet's recorder (tests/coverage/callmon.py), read by the next step.
          APEX_CALLMON_OUT: seen.json
        # -rs names any skip. A skip that nobody can name is a test that is not
        # running and looks like one that is; two runs on 2026-09-25 carried an
        # unidentified one.
        # FAILED/ERROR lines also go out as ::error:: annotations (2026-11-14): annotations are readable
        # without a token, the job log is not (CI 326). pytest's exit code is kept through the pipe.
        run: |
          set +e
          pytest -q -rsfE -p no:cacheprovider | tee pytest.out
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.out | head -50 | sed 's/^/::error title=pytest::/'
          exit $status

      - name: Function ratchet and change gate
        # tests/coverage/ratchet.py (2026-11-07, the every-object-tested rule): a new or regressed untested
        # money-path function fails, the baseline only shrinks, and a baseline function edited without a test
        # fails. Base: the branch's merge-base with master; on master, the commit before the push.
        env:
          PYTHONPATH: .
        run: |
          BASE=$(git merge-base HEAD origin/master)
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE="${{ github.event.before }}"; fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "change gate base: $BASE"
          python -m tests.coverage.ratchet check --seen seen.json --base "$BASE"

      # tests/test_exit_parity.py is EXIT_PARITY.md test 1a and its consumer is
      # this job. Its inputs are frozen (tests/fixtures/exit_parity_cases.json),
      # so its result can only change when backend/backtest/exit_rules.py,
      # engine.py or engine_fast.py change — which is why it belongs on a
      # trigger the host keeps rather than on a schedule. Called out here so a
      # future reader does not "move it to the nightly" for tidiness.
